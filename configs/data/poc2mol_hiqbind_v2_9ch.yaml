# parquet_v2 (float32 coords) with the ORIGINAL 9-channel ligand map.
# Deliberately changes ONE thing vs the old runs -- coordinate precision -- so any
# improvement is attributable. The stored coords were bfloat16-quantised to up to
# 0.49 A, ~2/3 of a 0.75 A voxel, on both the model input and its target (CLAUDE.md 15c).
_target_: src.data.poc2mol.data_module.ComplexDataModule
pdb_dir: null
val_pdb_dir: null
num_workers: 0
train_dataset:
  _target_: src.data.poc2mol.datasets.ParquetDataset
  data_path: "../hiqbind/parquet_v2/train"
  config: ${data.config}
# Validation and test are DETERMINISTIC. They previously inherited random_rotation: true
# and random_translation: 6.0 from data.config, and ParquetDataset draws a random member of
# each cluster per epoch -- so every validation scored a different augmentation of a
# different molecule. val/loss was a moving target, which is why the curves were noisy and
# why "has it started overfitting" was hard to call. Fixing all three makes val/loss a
# stable benchmark suitable for model selection and early stopping.
# NOTE: this shifts the absolute value of val/loss, so numbers are not comparable with runs
# from before 2026-08-06 (including ljv96zyo) without re-evaluating on the same setting.
val_dataset:
  _target_: src.data.poc2mol.datasets.ParquetDataset
  data_path: "../hiqbind/parquet_v2/val"
  config: ${data.config}
  rotate: false
  translation: 0.0
  use_cluster_member_zero: true
test_dataset:
  _target_: src.data.poc2mol.datasets.ParquetDataset
  data_path: "../hiqbind/parquet_v2/test"
  config: ${data.config}
  rotate: false
  translation: 0.0
  use_cluster_member_zero: true
config:
  _target_: src.data.common.voxelization.config.Poc2MolDataConfig 
  remove_hydrogens: true
  batch_size: 64
  target_samples_per_batch: 512
  ligand_channel_names:
    - carbon
    - oxygen
    - nitrogen
    - sulfur
    - chlorine
    - fluorine
    - iodine
    - bromine
    - other
  protein_channel_names:
    - carbon
    - oxygen
    - nitrogen
    - sulfur
  fnames: null 
  protein_channel_indices: [0, 1, 2, 3]
  ligand_channel_indices: [4, 5, 6, 7, 8, 9, 10, 11, 12]
  vox_size: 0.75
  box_dims: [ 24.0, 24.0, 24.0 ]
  random_rotation: true
  random_translation: 6.0
  has_protein: true
  protein_channels:
    0: [ "C" ]
    1: [ "O" ]
    2: [ "N" ]
    3: [ "S" ]
  ligand_channels:
    0: [ "C" ]
    1: [ "O" ]
    2: [ "N" ]
    3: [ "S" ]
    4: [ "Cl" ]
    5: [ "F" ]
    6: [ "I" ]
    7: [ "Br" ]
    8: [ "C", "H", "O", "N", "S", "Cl", "F", "I", "Br" ]
  max_atom_dist: 32.0
  dtype: ${oc.select:torch.bfloat16,torch.bfloat16}
