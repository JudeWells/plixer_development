# @package _global_
# Independent-seed rebuild of an ensemble-A member: frozen upstream, AUC-checkpointed, seed 46.
#
# WHY. Every ensemble number measured here -- 0.7883, 0.7984, 0.8057, 0.8090 -- comes from ONE
# panel and ONE set of trained members. The paired bootstrap covers panel-sampling noise only;
# no ensemble has been rebuilt from independent training seeds, so the training-seed component
# of the uncertainty is entirely unmeasured. This session has already had three single
# measurements evaporate under replication, and the A-vs-bundle gap (+0.020) is the number a
# paper would rest on.
#
# Seeds 46/47 are disjoint from the 42-45 used everywhere above, so a rebuilt A is statistically
# independent of the original rather than a re-scoring of it.
defaults:
  - e2e_w12_frozen_anneal
  - _self_

task_name: "aucrep_frozen_s46"
tags: ["${task_name}", "ensemble_replicate", "v2", "11ch", "seed${seed}"]

seed: 46
optimized_metric: "val/likelihood_auc_znorm"

logger:
  wandb:
    group: "rl_tanimoto_v1"

callbacks:
  model_checkpoint:
    monitor: "val/likelihood_auc_znorm"
    mode: "max"
    save_top_k: 1
    save_last: False
    filename: "step_{step:07d}_auc_{val/likelihood_auc_znorm:.4f}"
    auto_insert_metric_name: False
