# @package _global_
# DPO constant LR 1e-5 -- 2x the reference. RL at 5e-6 climbs for ~600 steps; if that is simply slow rather than converged, a larger step should reach the same level sooner and possibly higher.
#
# Constant LR throughout (warmup 50 then flat), 3000 steps, early stopping unreachable --
# identical to rl_dpo_const in every respect except the value being swept. Nothing anneals, so
# a difference between these arms is a difference in the LEARNING RATE and not in how much of
# each run was spent at a decayed rate. See the retraction note in CLAUDE.md §0 for why that
# matters here.
defaults:
  - rl_dpo_const
  - _self_

task_name: "rl_dpo_const_lr1e5"
tags: ["${task_name}", "rl", "dpo", "constlr", "lrsweep", "v2", "11ch", "seed${seed}"]

seed: 42

model:
  config:
    lr: 1e-5
